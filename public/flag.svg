<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="32" height="22">
  <defs>
    <linearGradient id="flag-white">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f5f5f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="flag-red">
      <stop offset="0" stop-color="#fb3856"/>
      <stop offset="0.5" stop-color="#c50b35"/>
      <stop offset="1" stop-color="#dc143c"/>
    </linearGradient>
    <!-- shadows in the troughs, none on the crests -->
    <linearGradient id="flag-shade">
      <stop offset="0"     stop-color="#000" stop-opacity="0.06"/>
      <stop offset="0.125" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.25"  stop-color="#000" stop-opacity="0.06"/>
      <stop offset="0.375" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="0.5"   stop-color="#000" stop-opacity="0.06"/>
      <stop offset="0.625" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75"  stop-color="#000" stop-opacity="0.06"/>
      <stop offset="0.875" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1"     stop-color="#000" stop-opacity="0.06"/>
    </linearGradient>
    <path id="flag-shape" d="M0,5 Q20,-5 40,5 T80,5 T120,5 T160,5 V105 Q140,115 120,105 Q100,95 80,105 Q60,115 40,105 Q20,95 0,105 Z"/>
  </defs>

  <!-- white stripe (full flag underneath, so there is no seam) -->
  <use href="#flag-shape" fill="url(#flag-white)"/>

  <!-- red stripe, wavy on both edges -->
  <path fill="url(#flag-red)" d="M0,55 Q20,45 40,55 T80,55 T120,55 T160,55 V105 Q140,115 120,105 Q100,95 80,105 Q60,115 40,105 Q20,95 0,105 Z"/>

  <!-- shading to sell the fabric effect -->
  <use href="#flag-shape" fill="url(#flag-shade)"/>
</svg>
